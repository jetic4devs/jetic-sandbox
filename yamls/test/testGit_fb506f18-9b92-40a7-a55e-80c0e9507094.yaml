---
apiVersion: "camel.apache.org/v1"
kind: "Integration"
metadata:
  labels:
    camel.apache.org/integration: "testGit"
    jetic.io/deployment.uuid: "fb506f18-9b92-40a7-a55e-80c0e9507094"
    jetic.io/integration.name: "testGit"
    jetic.io/integration.uuid: "fb506f18-9b92-40a7-a55e-80c0e9507094"
    jetic.io/log.level: "INFO"
    jetic.io/data.analyzer: "true"
    jetic.io/profile.name: "test"
    jetic.io/profile.uuid: "b4ea89fb-45af-4511-885c-d623c68992f5"
  name: "testgit"
spec:
  dependencies:
  - "mvn:io.jetic.analyzer:jetic-analyzer:2.2.4"
  replicas: 1
  sources:
  - compression: false
    content: |+
      //
      // To run this integration use:
      //
      // kamel run testGit.groovy
      //

      // camel-k: language=groovy
      // camel-k: name=testGit

      import io.jetic.analyzer.JeticAnalyzer

      // activate JETIC.IO Data Analyzer
      JeticAnalyzer.activate(getContext())

    name: "testGit.groovy"
  traits:
    addons: {}
    builder:
      properties:
      - "quarkus.application.name=testGit"
      - "quarkus.profile=test"
    jolokia:
      enabled: true
    logging:
      color: true
      level: "INFO"
    mount:
      resources:
      - "configmap:testgit-properties"
    owner:
      enabled: true
      targetLabels:
      - "jetic.io/data.analyzer"
      - "jetic.io/deployment.uuid"
      - "jetic.io/integration.name"
      - "jetic.io/integration.uuid"
      - "jetic.io/log.level"
      - "jetic.io/open.api.host"
      - "jetic.io/profile.name"
      - "jetic.io/profile.uuid"
