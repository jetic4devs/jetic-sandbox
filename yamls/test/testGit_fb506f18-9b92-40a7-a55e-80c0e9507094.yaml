data:
  application.properties: "quarkus.log.console.level=INFO"
kind: "ConfigMap"
metadata:
  labels:
    camel.apache.org/integration: "testGit"
    jetic.io/deployment.uuid: "fb506f18-9b92-40a7-a55e-80c0e9507094"
    jetic.io/integration.name: "testGit"
    jetic.io/integration.uuid: "fb506f18-9b92-40a7-a55e-80c0e9507094"
    jetic.io/log.level: "INFO"
    jetic.io/data.analyzer: "true"
