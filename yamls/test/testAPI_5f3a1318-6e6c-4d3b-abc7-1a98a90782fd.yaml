---
apiVersion: "camel.apache.org/v1"
kind: "Integration"
metadata:
  labels:
    camel.apache.org/integration: "testAPI"
    jetic.io/deployment.uuid: "5f3a1318-6e6c-4d3b-abc7-1a98a90782fd"
    jetic.io/integration.name: "testAPI"
    jetic.io/integration.uuid: "5f3a1318-6e6c-4d3b-abc7-1a98a90782fd"
    jetic.io/log.level: "INFO"
    jetic.io/data.analyzer: "true"
    jetic.io/profile.name: "test"
    jetic.io/profile.uuid: "b4ea89fb-45af-4511-885c-d623c68992f5"
    jetic.io/open.api.host: "localhost"
  name: "testapi"
spec:
  dependencies:
  - "mvn:io.jetic.analyzer:jetic-analyzer:2.2.4"
  replicas: 1
  flows:
  - rest:
      openApi:
        specification: "openAPITest.json"
  sources:
  - compression: false
    content: |-
      //
      // To run this integration use:
      //
      // kamel run testAPI.groovy
      //

      // camel-k: language=groovy
      // camel-k: name=testAPI

      import io.jetic.analyzer.JeticAnalyzer
      import org.apache.camel.LoggingLevel

      // activate JETIC.IO Data Analyzer
      JeticAnalyzer.activate(getContext())

      // route route-1 is disabled

      from('direct://getId').routeId('route-3')
          .log(LoggingLevel.INFO, 'log', 'Just ID').id('log: 01')

      from('direct://getFile').routeId('route-3-ed15f703')
          .log(LoggingLevel.INFO, 'log', 'ID and FIle').id('log: 02')
    name: "testAPI.groovy"
  traits:
    addons: {}
    builder:
      properties:
      - "quarkus.application.name=testAPI"
      - "quarkus.profile=test"
    environment:
      vars:
      - "OPENAPITEST.JSON=2024-11-13T09:59:26.921399"
      - "TEST=2024-11-11T15:42:31.520341650"
    jolokia:
      enabled: true
    logging:
      color: true
      level: "INFO"
    mount:
      configs:
      - "configmap:testAPI-properties"
      - "configmap:testAPI-openapi"
      resources:
      - "configmap:testAPI-resources"
    owner:
      enabled: true
      targetLabels:
      - "jetic.io/data.analyzer"
      - "jetic.io/deployment.uuid"
      - "jetic.io/integration.name"
      - "jetic.io/integration.uuid"
      - "jetic.io/log.level"
      - "jetic.io/open.api.host"
      - "jetic.io/profile.name"
      - "jetic.io/profile.uuid"
    service:
      enabled: true
