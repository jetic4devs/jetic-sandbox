---
apiVersion: "camel.apache.org/v1"
kind: "Integration"
metadata:
  labels:
    camel.apache.org/integration: "newInt"
    jetic.io/deployment.uuid: "cd5cd21c-86ef-4fa0-b63e-b329c9ba1cc0"
    jetic.io/integration.name: "newInt"
    jetic.io/integration.uuid: "cd5cd21c-86ef-4fa0-b63e-b329c9ba1cc0"
    jetic.io/log.level: "INFO"
    jetic.io/data.analyzer: "true"
    jetic.io/profile.name: "test"
    jetic.io/profile.uuid: "b4ea89fb-45af-4511-885c-d623c68992f5"
  name: "newint"
spec:
  dependencies:
  - "mvn:io.jetic.analyzer:jetic-analyzer:2.2.4"
  replicas: 1
  flows: []
  sources:
  - compression: false
    content: |+
      //
      // To run this integration use:
      //
      // kamel run newInt.groovy
      //

      // camel-k: language=groovy
      // camel-k: name=newInt

      import io.jetic.analyzer.JeticAnalyzer

      // activate JETIC.IO Data Analyzer
      JeticAnalyzer.activate(getContext())

    name: "newInt.groovy"
  traits:
    addons: {}
    builder:
      properties:
      - "quarkus.application.name=newInt"
      - "quarkus.profile=test"
    jolokia:
      enabled: true
    logging:
      color: true
      level: "INFO"
    mount:
      configs:
      - "configmap:newInt-properties"
    owner:
      enabled: true
      targetLabels:
      - "jetic.io/data.analyzer"
      - "jetic.io/deployment.uuid"
      - "jetic.io/integration.name"
      - "jetic.io/integration.uuid"
      - "jetic.io/log.level"
      - "jetic.io/open.api.host"
      - "jetic.io/profile.name"
      - "jetic.io/profile.uuid"
