data:
  application.properties: "quarkus.log.console.level=INFO"
kind: "ConfigMap"
metadata:
  labels:
    camel.apache.org/integration: "newInt"
    jetic.io/deployment.uuid: "cd5cd21c-86ef-4fa0-b63e-b329c9ba1cc0"
    jetic.io/integration.name: "newInt"
    jetic.io/integration.uuid: "cd5cd21c-86ef-4fa0-b63e-b329c9ba1cc0"
    jetic.io/log.level: "INFO"
    jetic.io/data.analyzer: "true"
