---
apiVersion: "camel.apache.org/v1"
kind: "Integration"
metadata:
  labels:
    camel.apache.org/integration: "testRun"
    jetic.io/deployment.uuid: "6c9a920b-c6b4-425d-a35f-a62d1cd99423"
    jetic.io/integration.name: "testRun"
    jetic.io/integration.uuid: "6c9a920b-c6b4-425d-a35f-a62d1cd99423"
    jetic.io/log.level: "INFO"
    jetic.io/data.analyzer: "true"
    jetic.io/profile.name: "test"
    jetic.io/profile.uuid: "b4ea89fb-45af-4511-885c-d623c68992f5"
  name: "testrun"
spec:
  dependencies:
  - "mvn:io.jetic.analyzer:jetic-analyzer:2.2.4"
  replicas: 1
  flows: []
  sources:
  - compression: false
    content: |+
      //
      // To run this integration use:
      //
      // kamel run testRun.groovy
      //

      // camel-k: language=groovy
      // camel-k: name=testRun

      import io.jetic.analyzer.JeticAnalyzer

      // activate JETIC.IO Data Analyzer
      JeticAnalyzer.activate(getContext())

    name: "testRun.groovy"
  traits:
    addons: {}
    builder:
      properties:
      - "quarkus.application.name=testRun"
      - "quarkus.profile=test"
    jolokia:
      enabled: true
    logging:
      color: true
      level: "INFO"
    mount:
      configs:
      - "configmap:testRun-properties"
    owner:
      enabled: true
      targetLabels:
      - "jetic.io/data.analyzer"
      - "jetic.io/deployment.uuid"
      - "jetic.io/integration.name"
      - "jetic.io/integration.uuid"
      - "jetic.io/log.level"
      - "jetic.io/open.api.host"
      - "jetic.io/profile.name"
      - "jetic.io/profile.uuid"
